name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.2.2.stable \
                /github/home/.local/share/godot/export_templates/4.2.2.stable

      - name: Write Editor Settings
        run: |
          mkdir -p /github/home/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > /github/home/.config/godot/editor_settings-4.tres
          echo '' >> /github/home/.config/godot/editor_settings-4.tres
          echo '[resource]' >> /github/home/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> /github/home/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> /github/home/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> /github/home/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_pass = "android"' >> /github/home/.config/godot/editor_settings-4.tres
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> /github/home/.config/godot/editor_settings-4.tres
          echo "=== settings written ==="
          cat /github/home/.config/godot/editor_settings-4.tres

      - name: Import Project
        run: |
          mkdir -p build
          timeout 40 godot --headless --import 2>&1 | tail -20 || true

      - name: Export APK
        run: |
          godot --headless --export-debug "Android" build/MurderMystery.apk 2>&1
          find . -name "*.apk" || echo "no apk found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MurderMystery-APK
          path: build/MurderMystery.apk
          if-no-files-found: warn
