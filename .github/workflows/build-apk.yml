name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore $HOME/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Write Godot Editor Settings
        run: |
          mkdir -p $HOME/.config/godot
          python3 - << 'PYEOF'
          import os
          sdk  = os.environ.get("ANDROID_SDK_ROOT", "")
          java = os.environ.get("JAVA_HOME", "")
          home = os.path.expanduser("~")
          ks   = home + "/debug.keystore"
          content = (
              '[gd_resource type="EditorSettings" format=3]\n\n'
              '[resource]\n'
              'export/android/android_sdk_path = "{}"\n'
              'export/android/java_sdk_path = "{}"\n'
              'export/android/debug_keystore = "{}"\n'
              'export/android/debug_keystore_user = "androiddebugkey"\n'
              'export/android/debug_keystore_pass = "android"\n'
          ).format(sdk, java, ks)
          path = home + "/.config/godot/editor_settings-4.tres"
          open(path, "w").write(content)
          print("wrote:", path)
          print(content)
          PYEOF

      - name: Import Project
        run: |
          mkdir -p build
          timeout 40 godot --headless --import 2>&1 | tail -10 || true

      - name: Export APK
        run: |
          godot --headless --export-debug "Android" build/MurderMystery.apk 2>&1
          echo "--- find apk ---"
          find . -name "*.apk" 2>/dev/null || echo "no apk found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MurderMystery-APK
          path: "**/*.apk"
          if-no-files-found: error
